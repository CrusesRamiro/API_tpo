spring.application.name=demo
server.port=4002

# Configuracion principal con fallback local para poder arrancar desde el IDE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/demo;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:f0SYKiA5wyR5ufg2V6rKSMB1i664Ca3KSvGuu+YU+xHJN1lOPIICZjJB9grc6GVYGM4oMfoWkNSM7H+qoxAS3Q==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Util para inspeccionar la base local cuando se usa H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
